name: Daily Mandi Price Scraper

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Run scraper
        env:
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: python scripts/scraper.py

      - name: Save CSV to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Daily prices ${{ github.run_id }}"
          file_pattern: "prices/*.csv"
